name: E2E static checks

on:
  pull_request:
    branches:
    - main
    paths:
    - 'tests/**'
    - 'pyproject.toml'
  merge_group:

permissions:
  contents: read

jobs:

  e2e-static-checks:
    name: E2E static checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python
    - name: Install dependencies
      run: uv sync
    - name: Validate test collection
      env:
        METERING_ADAPTER_URL: http://unused
      run: uv run pytest --collect-only -q tests/e2e/
    - name: Lint test code
      run: uv run ruff check tests/e2e/
