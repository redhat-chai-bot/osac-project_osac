- name: Wait until network operator is available
  block:
    - name: Poll network ClusterOperator until Available
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: ClusterOperator
        name: network
        kubeconfig: "{{ wait_for_kubeconfig }}"
        wait_timeout: "{{ wait_for_request_timeout | default(30) }}"
      register: network_cluster_operator_results
      until: condition.status == "True"
      retries: "{{ wait_for_cluster_retries }}"
      delay: "{{ wait_for_cluster_delay }}"
      vars:
        network_cluster_operator: >-
          {{ network_cluster_operator_results.resources[0] | default({}) }}
        condition: >-
          {{
            (
            network_cluster_operator|json_query("status.conditions[?type=='Available']")|
            default([{"status": "False"}], true)
            )|first
          }}

  rescue:
    - name: Fetch network ClusterOperator status for diagnostics
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: ClusterOperator
        name: network
        kubeconfig: "{{ wait_for_kubeconfig }}"
        wait_timeout: "{{ wait_for_request_timeout | default(30) }}"
      register: wait_for_rescue_network_co

    - name: Dump network ClusterOperator conditions
      ansible.builtin.debug:
        msg: |
          Network ClusterOperator conditions at time of failure:
          {{ wait_for_rescue_co_conditions | to_nice_yaml(indent=2) }}
      vars:
        wait_for_rescue_co_conditions: >-
          {{ (wait_for_rescue_network_co.resources[0].status.conditions | default([])) }}

    - name: Re-raise network ClusterOperator wait failure
      ansible.builtin.fail:
        msg: >-
          Network ClusterOperator did not become available.
          {{ ansible_failed_result.msg | default('Timeout waiting for condition.') }}
