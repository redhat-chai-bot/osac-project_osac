---
- name: Verify disk readiness evidence through the real Kubernetes API
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run readiness consumer with persisted disk and hub resources
      ansible.builtin.command:
        argv:
          - uv
          - run
          - python
          - "{{ playbook_dir }}/../files/verify_disk_readiness.py"
      args:
        chdir: "{{ playbook_dir }}/../../../../../"
      changed_when: false
